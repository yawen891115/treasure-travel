name = "treasure-travel-agent"
main = "agent/index.js"
compatibility_date = "2026-09-01"

[vars]
MODEL = "claude-haiku-5-5"
ANTHROPIC_VERSION = "2026-10-21"
ALLOWED_ORIGINS = "https://treasure-travel-boston-demo.brainyraisin5.chatgpt.site"
PER_IP_PER_HOUR = "20"
DAILY_LIMIT = "300"
MAX_ROUNDS = "8"
MAX_TOKENS = "1024"

# Secrets (never commit them): npx wrangler secret put ANTHROPIC_API_KEY
# Optional:                    npx wrangler secret put GOOGLE_MAPS_API_KEY

# Optional: request counts shared across Worker instances.
# Create with `npx wrangler kv namespace create RATE_KV`, then uncomment:
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<namespace id>"
